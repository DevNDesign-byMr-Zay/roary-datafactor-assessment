name: assessment/ci

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "17 10 * * 1"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Reproducible install
        run: npm ci --ignore-scripts
      - name: Dependency security audit
        run: npm audit --audit-level=moderate
      - name: Type-check maintained JavaScript
        run: npm run typecheck
      - name: Verify maintained and historical surface split
        run: npm run verify:surface
      - name: Lint maintained service and tests
        run: npm run lint
      - name: Verify promoted corpus integrity
        run: npm run verify:integrity
      - name: Verify release-readiness contract
        run: npm run verify:release
      - name: Smoke-test release manifest generation
        shell: bash
        run: |
          set -euo pipefail
          release_tag="v$(node -p "require('./package.json').version")"
          node scripts/create-release-manifest.mjs "$release_tag" "$GITHUB_SHA" "$RUNNER_TEMP/release-manifest.json"
          test -s "$RUNNER_TEMP/release-manifest.json"

      - name: Run conventional test suite
        shell: bash
        run: |
          set -euo pipefail
          test -z "${GOOGLE_APPLICATION_CREDENTIALS:-}"
          env -u GOOGLE_APPLICATION_CREDENTIALS npm test
      - name: Run credential-free tests with enforced coverage
        shell: bash
        run: |
          set -euo pipefail
          test -z "${GOOGLE_APPLICATION_CREDENTIALS:-}"
          env -u GOOGLE_APPLICATION_CREDENTIALS npm run test:coverage
      - name: Retain Jest coverage report
        uses: actions/upload-artifact@v7
        with:
          name: jest-coverage-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: coverage/
      - name: Run renewable evidence demo
        run: npm run demo:renewable-evidence

  container-smoke:
    name: Container startup smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Validate canonical Compose configuration
        run: docker compose -f docker-compose.yml config --quiet
      - name: Build, start, and probe health
        shell: bash
        run: |
          set -euo pipefail
          export COMPOSE_FILE=docker-compose.yml
          docker compose up --build --detach
          trap 'docker compose down --volumes --remove-orphans' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:8080/health >/dev/null; then
              docker compose ps
              exit 0
            fi
            sleep 2
          done

          docker compose ps
          docker compose logs --no-color
          exit 1


  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Run typecheck
        run: npm run typecheck

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Run lint
        run: npm run lint

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Run tests
        run: env -u GOOGLE_APPLICATION_CREDENTIALS npm test

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Run coverage gate
        run: env -u GOOGLE_APPLICATION_CREDENTIALS npm run test:coverage

  fresh-clone-smoke:
    name: fresh-clone-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository without build state
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Set up Node.js without dependency cache
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Prove clean locked install and maintained verification
        shell: bash
        run: |
          set -euo pipefail
          rm -rf node_modules coverage
          npm ci --ignore-scripts
          npm audit --audit-level=moderate
          npm run check
      - name: Build container without cached image layers
        run: docker compose -f docker-compose.yml build --no-cache
      - name: Start clean container and probe health
        shell: bash
        run: |
          set -euo pipefail
          export COMPOSE_FILE=docker-compose.yml
          docker compose up --detach
          trap 'docker compose down --volumes --remove-orphans' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:8080/health >/dev/null; then
              curl --fail --silent --show-error http://127.0.0.1:8080/health
              docker compose ps
              exit 0
            fi
            sleep 2
          done
          docker compose logs --no-color
          exit 1

  maintenance-scripts:
    name: Corpus maintenance script syntax
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Compile maintenance scripts
        run: python -m py_compile .github/scripts/import_drive.py .github/scripts/verify_drive.py

