name: assessment/ci

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "17 10 * * 1"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Reproducible install
        run: npm ci --ignore-scripts
      - name: Dependency security audit
        run: npm audit --audit-level=moderate
      - name: Lint maintained service and tests
        run: npm run lint
      - name: Verify promoted corpus integrity
        run: npm run verify:integrity
      - name: Verify release-readiness contract
        run: npm run verify:release
      - name: Run tests with enforced coverage
        run: npm run test:coverage
      - name: Run renewable evidence demo
        run: npm run demo:renewable-evidence

  container-smoke:
    name: Container startup smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build, start, and probe health
        shell: bash
        run: |
          set -euo pipefail
          docker compose up --build --detach
          trap 'docker compose down --volumes --remove-orphans' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:8080/health >/dev/null; then
              docker compose ps
              exit 0
            fi
            sleep 2
          done

          docker compose ps
          docker compose logs --no-color
          exit 1

  maintenance-scripts:
    name: Corpus maintenance script syntax
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Compile maintenance scripts
        run: python -m py_compile .github/scripts/import_drive.py .github/scripts/verify_drive.py

