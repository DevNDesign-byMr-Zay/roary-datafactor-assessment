name: assessment/ci

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "17 10 * * 1"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Reproducible install
        run: npm ci --ignore-scripts
      - name: Dependency security audit
        run: npm audit --audit-level=high
      - name: Lint maintained service and tests
        run: npm run lint
      - name: Run tests with enforced coverage
        run: npm run test:coverage
