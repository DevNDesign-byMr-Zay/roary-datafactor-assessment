<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>ASTER Studio — Regenerated (External OCR, Sources Fixed)</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" type="image/png" href="ASTER LOGO.png">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
<!-- libs -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.5/dist/purify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
<script>mermaid.initialize({ startOnLoad:false, theme: 'dark' });</script>

<style>
:root{
  --glass-bg: rgba(255,255,255,0.06);
  --glass-border: rgba(255,255,255,0.22);
  --panel-glow: 0 10px 40px rgba(255,255,255,0.06);
  --text: #ffffff;
  --muted: #b8b8b8;
  --btn-gray: #3a3a3a;
  --btn-gray-2: #2d2d2d;
  --accent: #7aa2ff;
}
*{ box-sizing:border-box }
html,body{ height:100% }
body{
  margin:0; color:var(--text);
  font-family: Roboto, system-ui, -apple-system, Segoe UI, Arial, sans-serif;
  background: radial-gradient(1200px 800px at 70% -10%, #1b1c20 0%, #0c0c0c 40%, #000 100%);
  overflow:hidden;
}
*{ scrollbar-width:thin; scrollbar-color:#6a6a6a transparent; }
*::-webkit-scrollbar{ width:10px; height:10px }
*::-webkit-scrollbar-thumb{ background:#6a6a6a; border-radius:10px }
*::-webkit-scrollbar-track{ background:transparent }

.topbar{
  position:fixed; inset:0 0 auto 0; height:64px; display:flex; align-items:center; gap:12px;
  backdrop-filter: blur(16px); background: var(--glass-bg); border-bottom: 1px solid var(--glass-border);
  padding: 0 16px; z-index: 1000; box-shadow: var(--panel-glow);
}
.brand{ display:flex; align-items:center; gap:10px; }
.brand img.logo{ width:32px; height:32px; object-fit:contain; filter:drop-shadow(0 0 6px rgba(255,255,255,.2)); }
.brand h1{ margin:0; font-weight:700; font-size:18px; letter-spacing:.8px; }

.topbar-actions{ margin-left:auto; display:flex; align-items:center; gap:10px; min-width:0; }
.icon-btn{
  background: var(--btn-gray-2); border:1px solid #4a4a4a; color:var(--text);
  padding:10px 14px; border-radius:12px; cursor:pointer; display:inline-flex; align-items:center; gap:8px;
  transition: transform .15s ease, background .25s ease, border-color .25s ease;
  white-space:nowrap;
}
.icon-btn:hover{ transform:translateY(-1px); background:#444; border-color:#6b6b6b; }
.icon-btn svg{ width:18px; height:18px; }

.layout{ position:absolute; inset:64px 0 0 0; display:flex; }

/* LEFT SIDEBAR */
.leftbar{
  width: 320px; min-width: 320px; max-width: 320px;
  flex: 0 0 320px; backdrop-filter: blur(16px); background: var(--glass-bg);
  border-right:1px solid var(--glass-border); box-shadow: var(--panel-glow) inset;
  display:flex; flex-direction:column; overflow:hidden; z-index:1; contain: inline-size;
  transition: width .24s ease, min-width .24s ease, max-width .24s ease;
}
.leftbar.collapsed{ width: 130px; min-width: 130px; max-width: 130px; flex: 0 0 130px; }
.leftbar-header{ border-bottom:1px solid var(--glass-border); padding:10px; }
.leftbar-controls{ display:flex; align-items:center; gap:8px; justify-content:flex-start; }
.sidebar-toggle{
  background: var(--btn-gray); border:1px solid #575757; color:var(--text); padding:8px 10px; border-radius:12px; cursor:pointer;
  display:inline-flex; align-items:center; justify-content:center; transition: all .25s ease; width:40px; height:36px;
}
.icon-hamburger, .icon-close{ width:18px; height:18px; }
.icon-close{ display:none; }
.leftbar:not(.collapsed) .icon-hamburger{ display:none; }
.leftbar:not(.collapsed) .icon-close{ display:block; }
.float-select{ position:relative; flex:1 1 auto; min-width:0; }
.fs-btn{
  width:100%; background: rgba(255,255,255,.06); border:1px solid var(--glass-border); color:var(--text);
  border-radius:14px; padding:10px 12px; display:flex; align-items:center; justify-content:space-between; gap:10px;
  cursor:pointer; box-shadow: var(--panel-glow); transition: border-color .2s ease, background .2s ease;
}

.leftbar-title{ padding:8px 10px 6px 10px; font-weight:700; letter-spacing:.5px; white-space:nowrap; }
.new-chat-wrap{ padding: 8px 10px; }
.new-chat{ display:flex; align-items:center; gap:8px; padding:10px 12px; border-radius:12px; background: var(--btn-gray);
  border:1px solid #575757; color:var(--text); cursor:pointer; transition: all .25s ease; }
.leftbar.collapsed .new-chat{ width:40px; height:34px; justify-content:center; align-items:center; margin: 0 auto 0 36px; }
.leftbar.collapsed .new-chat .label{ display:none; }
.new-chat:hover{ background:#4a4a4a; }
.new-chat svg{ width:18px; height:18px; display:block; }

.conv-list{ overflow:auto; padding: 4px 8px 12px 8px; height:100%; }
.conv-item{
  background: rgba(255,255,255,.03); border:1px solid rgba(255,255,255,.12); border-radius:12px; padding:10px 12px;
  display:flex; align-items:center; gap:8px; margin-bottom:10px; cursor:pointer; transition: background .2s ease, border-color .2s ease; position:relative;
}
.conv-item:hover{ background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.22); }
.conv-name{ flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.pin{ color:#ffd479; opacity:.85; display:none; }
.conv-item.pinned .pin{ display:inline; }
.kebab{ background:transparent; border:0; color:var(--text); opacity:.85; cursor:pointer; padding:6px; border-radius:8px; }
.kebab:hover{ background: rgba(255,255,255,.08); }
.conv-menu{
  position:absolute; right:8px; transform: translateY(28px); min-width: 160px; z-index:3500; display:none;
  background: rgba(10,10,10,.96); backdrop-filter: blur(10px); border:1px solid rgba(255,255,255,.15); border-radius:12px; overflow:hidden;
}
.conv-menu.open{ display:block; }
.conv-menu button{ width:100%; text-align:left; padding:10px 12px; background:transparent; border:0; color:var(--text); cursor:pointer; }
.conv-menu button:hover{ background: rgba(255,255,255,.08); }

.leftbar-footer{ padding:10px; border-top:1px solid var(--glass-border); color:var(--muted); font-size:11.5px; text-align:center; }

.main{ display:flex; flex-direction:column; flex:1 1 auto; min-width:0; background:#000; }
.chat{ flex:1 1 auto; overflow:auto; padding:20px 18px 120px 18px; }
.chat-inner{ display:flex; flex-direction:column; }
.msg{
  max-width:78%; background: rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.14);
  border-radius:16px; padding:12px 14px; margin:10px 0; line-height:1.5; backdrop-filter: blur(8px); word-break: break-word;
}
.msg.assistant{ align-self:flex-start; border-left:2px solid rgba(255,255,255,.35);} 
.msg.user{ align-self:flex-end; background: rgba(255,255,255,.08); border-right:2px solid rgba(255,255,255,.30); }

.composer-wrap{
  position:absolute; left: 338px; right:20px; bottom:16px; display:flex; align-items:center; gap:10px;
  z-index: 1200; padding-bottom: calc(env(safe-area-inset-bottom, 0px));
}
.attachments-row{
  position:absolute; left: 338px; right:20px; bottom:86px; display:flex; gap:8px; flex-wrap:wrap;
  max-height:120px; overflow:auto; padding:2px 2px 8px 2px;
}
.chip{ display:flex; align-items:center; gap:8px; padding:6px 10px; border:1px solid rgba(255,255,255,.15); border-radius:12px; background: rgba(255,255,255,.06); }
.chip button{ background:transparent; border:0; color:var(--text); cursor:pointer; padding:0 4px; border-radius:6px; }
.chip button:hover{ background: rgba(255,255,255,.1); }

.composer{
  flex:1; display:flex; align-items:center; gap:10px; padding:12px;
  background: linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.02));
  border-radius: 18px 18px 22px 22px / 18px 18px 22px 22px;
  border:1px solid rgba(255,255,255,.14);
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.08), 0 8px 28px rgba(0,0,0,.5);
  position:relative;
}
.composer textarea{
  flex:1; resize:none; height:52px; max-height:52px; overflow-y:auto; background:transparent; border:0; outline:0; color:var(--text); font:400 15px/1.4 Roboto, sans-serif;
}
.btn{
  background: var(--btn-gray); border:1px solid #5a5a5a; color:var(--text);
  padding:10px 12px; border-radius:12px; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:8px; min-width:44px; transition: all .2s ease;
}
.btn:hover{ background:#4a4a4a; border-color:#6d6d6d; }
.send-icon,.stop-icon{ width:18px; height:18px; transition:transform .15s ease, opacity .15s ease; }
.stop-icon{ display:none; }
.btn.sending .send-icon{ display:none; }
.btn.sending .stop-icon{ display:inline-block; }

.settings-panel{
  position:absolute; top:0; right:0; bottom:0; width:440px; max-width:92vw; background: var(--glass-bg); backdrop-filter: blur(16px);
  border-left:1px solid var(--glass-border); box-shadow: var(--panel-glow); transform: translateX(100%); transition: transform .35s ease; padding:16px 14px 24px 14px; overflow:auto; z-index:2000;
}
.settings-panel.open{ transform: translateX(0%); }
.overlay{ position:fixed; top:64px; left:0; right:0; bottom:0; background: rgba(0,0,0,.25); backdrop-filter: blur(6px); opacity:0; pointer-events:none; transition: opacity .25s ease; z-index:1500; }
.overlay.show{ opacity:1; pointer-events:auto; }
.section{ margin-bottom:20px; }
.section h3{ margin:0 0 8px 0; font-size:14px; font-weight:700; letter-spacing:.3px; }
.section small{ color:var(--muted); }
.field{ display:flex; flex-direction:column; gap:6px; margin:10px 0; }
.field label{ font-size:13px; color:var(--muted); }
.field textarea,.field input[type="text"],.field input[type="password"], .field select, .field input[type="number"]{
  background: rgba(255,255,255,.06); border:1px solid var(--glass-border); color:var(--text);
  border-radius:12px; padding:10px 12px; outline:none;
}

/* Sources bar */
.sources-bar{ align-self:flex-start; max-width:72%; margin:4px 0 10px 0; background:transparent; }
.sources-head{
  display:flex; align-items:center; gap:8px; cursor:pointer; user-select:none; font-weight:600; font-size:12.5px; letter-spacing:.2px;
  opacity:0; transform: translateY(6px); animation: fadeIn .22s ease forwards;
}
.sources-head .chips{ display:flex; align-items:center; gap:4px; margin-left:4px; opacity:.9; transform: translateY(1px); }
.sources-chip{
  height:18px; min-width:18px; border-radius:50%; background:#fff; display:inline-flex; align-items:center; justify-content:center;
  box-shadow:0 1px 2px rgba(0,0,0,.35), inset 0 0 0 1px rgba(0,0,0,.06); overflow:hidden; padding:0 2px; font-size:11px; color:#111; font-weight:700;
}
.sources-chip img{ width:14px; height:14px; display:block; }
.sources-caret{ margin-left:auto; opacity:.9; transition: transform .18s ease; }
.sources-open .sources-caret{ transform: rotate(90deg); }

.sources-list{
  margin-top:6px; padding:8px 10px; border:1px solid rgba(255,255,255,.15); border-radius:10px; background: rgba(255,255,255,.05);
  max-height:0; overflow:hidden; opacity:0; transform-origin: top left; transform: translateY(-6px) scale(.98);
  filter: blur(2px); clip-path: inset(0 0 100% 0 round 10px);
  transition: transform .18s ease, opacity .18s ease, filter .18s ease, clip-path .28s ease, max-height .28s ease;
}
.sources-open .sources-list{
  max-height:420px; opacity:1; transform: translateY(0) scale(1); filter: blur(0); clip-path: inset(0 0 0 0 round 10px);
}
.sources-item{
  display:grid; grid-template-columns: 18px 1fr; gap:8px; padding:6px 0; border-bottom:1px dashed rgba(255,255,255,.14);
  opacity:1; transform: translateY(0) scale(1);
}
.sources-item:last-child{ border-bottom:0; }
.sources-item .favicon{ width:14px; height:14px; margin:2px; border-radius:4px; }
.sources-item a{ color:#d6e5ff; text-decoration:none; font-size:13px; }
.sources-item a:hover{ text-decoration:underline; }

@keyframes fadeIn { to { opacity:1; transform: translateY(0); } }
</style>
</head>
<body>
  <div class="topbar">
    <div class="brand">
      <img class="logo" src="ASTER LOGO.png" alt="ASTER Logo" onerror="this.style.display='none'">
      <h1>ASTER Studio</h1>
    </div>
    <div class="topbar-actions">
      <button class="icon-btn" id="openSettings" type="button" title="Settings" aria-haspopup="dialog" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z M19.4 15a7.96 7.96 0 0 0 0-6l2-1.2-2-3.4-2 .8a8.1 8.1 0 0 0-3.5-2l-.3-2.2H10.4l-.3 2.2a8.1 8.1 0 0 0-3.5 2l-2-.8-2 3.4 2 1.2a7.96 7.96 0 0 0 0 6l-2 1.2 2 3.4 2-.8a8.1 8.1 0 0 0 3.5 2l.3 2.2h3.4l.3-2.2a8.1 8.1 0 0 0 3.5-2l2 .8 2-3.4-2-1.2Z" stroke="currentColor" stroke-width="1" /></svg>
        <span>Settings</span>
      </button>
    </div>
  </div>

  <div class="layout">
    <aside id="leftSidebar" class="leftbar" aria-label="Sidebar">
      <div class="leftbar-header">
        <div class="leftbar-controls">
          <button id="sidebarToggle" class="sidebar-toggle" type="button" title="Toggle Sidebar" aria-pressed="false">
            <svg class="icon-hamburger" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            <svg class="icon-close" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <div style="flex:1"></div>
        </div>
      </div>

      <div class="leftbar-title" id="convTitle">Conversations</div>

      <div class="new-chat-wrap">
        <button id="newChatBtn" class="new-chat" type="button" title="New Chat">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <span class="label">New Chat</span>
        </button>
      </div>

      <div id="convList" class="conv-list"></div>
      <div class="leftbar-footer">ASTER Studio © 2025</div>
    </aside>

    <main class="main">
      <div class="chat" id="chat"><div class="chat-inner" id="chatInner"></div></div>

      <div id="attachmentsRow" class="attachments-row"></div>

      <div class="composer-wrap">
        <div class="composer">
          <button id="attachBtn" class="btn" type="button" title="Attach files" tabindex="0">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M21 8v7a6 6 0 1 1-12 0V7a4 4 0 1 1 8 0v7a2 2 0 1 1-4 0V8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <input id="attachInput" type="file" multiple style="display:none"
            accept=".txt,.md,.markdown,.json,.csv,.tsv,.yaml,.yml,.ini,.cfg,.conf,.xml,.svg,.html,.htm,.css,.scss,.less,.js,.mjs,.cjs,.jsx,.ts,.tsx,.py,.rb,.php,.go,.rs,.java,.kt,.c,.cpp,.h,.hpp,.cs,.sql,.ps1,.bat,.sh,.ico,.png,.jpg,.jpeg,.gif,.webp,.bmp,.tif,.tiff,.pdf,.mp4,.mov,.avi,.wav,.mp3" />

          <button id="webSearchBtn" class="btn toggle-btn" type="button" title="Web Search toggle" aria-pressed="false" tabindex="0">🌐</button>

          <textarea id="composerInput" placeholder="Message ASTER…"></textarea>

          <button id="sendBtn" class="btn" type="button" title="Send / Stop" aria-label="Send message" tabindex="0">
            <svg class="send-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 12l16-8-6 8 6 8-16-8z" stroke="currentColor" stroke-width="1.5" fill="currentColor"/></svg>
            <svg class="stop-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/></svg>
          </button>
        </div>
      </div>
    </main>

    <div id="overlay" class="overlay" aria-hidden="true"></div>

    <aside class="settings" aria-label="Settings">
      <div id="settingsPanel" class="settings-panel" aria-hidden="true">
        <div class="section"><h3>System</h3><small>Model & Router</small></div>

        <div class="section">
          <h3>LLM Proxy</h3>
          <div class="field"><label for="proxyUrl">LiteLLM Proxy URL</label><input id="proxyUrl" type="text" placeholder="http://127.0.0.1:8001" /></div>
          <div class="field"><label for="masterKey">Master Key</label><input id="masterKey" type="password" placeholder="local-key" /></div>
          <div class="field"><label for="modelId">Model ID</label><input id="modelId" type="text" placeholder="groq/llama-3.1-8b-instant" /></div>
        </div>

        <div class="section">
          <h3>Web Tool</h3>
          <div class="field"><label for="webToolBase">Web Tool Base</label><input id="webToolBase" type="text" placeholder="http://127.0.0.1:5055" /></div>
          <div class="field"><label><input id="autoWebToggle" type="checkbox" checked/> Auto-detect web</label></div>
        </div>

        <div class="section">
          <h3>External OCR Adapters (preferred)</h3>
          <small>Any of these will be tried in order. If CORS blocks, proxy them via your router.</small>
          <div class="field"><label for="edenKey">EdenAI API Key</label><input id="edenKey" type="password" placeholder="eyJhbGciOi..." /></div>
          <div class="field"><label for="ocrSpaceKey">OCR.space API Key</label><input id="ocrSpaceKey" type="password" placeholder="helloworld" /></div>
          <div class="field"><label for="unstructuredKey">Unstructured API Key</label><input id="unstructuredKey" type="password" placeholder="UNSTRUCTURED_API_KEY" /></div>
          <div class="field"><label for="ocrProxyUrl">Custom OCR Proxy URL</label><input id="ocrProxyUrl" type="text" placeholder="http://127.0.0.1:8080/ocr" /></div>
          <div class="field"><label><input id="allowTesseractFallback" type="checkbox" checked/> Fallback to lightweight local Tesseract (CDN)</label></div>
        </div>

        <div class="section" style="position:sticky;bottom:0;background:linear-gradient(180deg,transparent,rgba(0,0,0,.3));padding-top:6px;">
          <button id="saveSettings" class="btn" type="button" style="width:100%;">Save & Apply</button>
        </div>
      </div>
    </aside>
  </div>

<script>
(function(){
'use strict';

/* ========= Simple $, $$ ========= */
const $ = (s, r=document)=>r.querySelector(s);
const $$ = (s, r=document)=>Array.from(r.querySelectorAll(s));

/* ========= Elements ========= */
const leftSidebar = $("#leftSidebar");
const sidebarToggle = $("#sidebarToggle");
const chatInner = $("#chatInner");
const composer = $("#composerInput");
const sendBtn = $("#sendBtn");
const webBtn = $("#webSearchBtn");
const newChatBtn = $("#newChatBtn");
const convList = $("#convList");
const openSettingsBtn = $("#openSettings");
const settingsPanel = $("#settingsPanel");
const overlay = $("#overlay");
const attachBtn = $("#attachBtn");
const attachInput = $("#attachInput");
const attachmentsRow = $("#attachmentsRow");
const saveBtnEl = $("#saveSettings");

/* ========= State ========= */
let conversations = [];
let activeId = null;
let sessionAttachments = [];

// Settings
let proxy = localStorage.getItem("aster.proxy") || "http://127.0.0.1:8001";
let masterKey = localStorage.getItem("aster.masterKey") || "local-key";
let modelId = localStorage.getItem("aster.modelId") || "groq/llama-3.1-8b-instant";
let webToolBase = localStorage.getItem("aster.webToolBase") || "http://127.0.0.1:5055";
let autoWeb = (localStorage.getItem("aster.autoWeb") ?? "1") === "1";

let edenKey = localStorage.getItem("aster.edenKey") || "";
let ocrSpaceKey = localStorage.getItem("aster.ocrSpaceKey") || "";
let unstructuredKey = localStorage.getItem("aster.unstructuredKey") || "";
let ocrProxyUrl = localStorage.getItem("aster.ocrProxyUrl") || "";
let allowTesseractFallback = (localStorage.getItem("aster.allowTess") ?? "1") === "1";

/* ========= Hydrate settings panel ========= */
$("#proxyUrl").value = proxy;
$("#masterKey").value = masterKey;
$("#modelId").value = modelId;
$("#webToolBase").value = webToolBase;
$("#autoWebToggle").checked = autoWeb;

$("#edenKey").value = edenKey;
$("#ocrSpaceKey").value = ocrSpaceKey;
$("#unstructuredKey").value = unstructuredKey;
$("#ocrProxyUrl").value = ocrProxyUrl;
$("#allowTesseractFallback").checked = allowTesseractFallback;

/* ========= UI controls ========= */
function setSidebarCollapsed(collapsed){
  leftSidebar.classList.toggle("collapsed", !!collapsed);
  document.documentElement.style.setProperty("--composer-left", (leftSidebar.offsetWidth+18)+"px");
  localStorage.setItem("aster.sidebarCollapsed", collapsed?"1":"0");
  sidebarToggle.setAttribute('aria-pressed', (!collapsed).toString());
}
setSidebarCollapsed(localStorage.getItem("aster.sidebarCollapsed")==="1");
window.addEventListener("resize", ()=>document.documentElement.style.setProperty("--composer-left", (leftSidebar.offsetWidth+18)+"px"));
sidebarToggle.addEventListener("click", ()=> setSidebarCollapsed(!leftSidebar.classList.contains("collapsed")));

function setSettingsOpen(open){
  settingsPanel.classList.toggle("open", !!open);
  overlay.classList.toggle("show", !!open);
  settingsPanel.setAttribute("aria-hidden", open?"false":"true");
  overlay.setAttribute("aria-hidden", open?"false":"true");
  openSettingsBtn.setAttribute('aria-expanded', (!!open).toString());
}
openSettingsBtn.addEventListener("click", ()=> setSettingsOpen(!settingsPanel.classList.contains("open")));
overlay.addEventListener("click", ()=> setSettingsOpen(false));
document.addEventListener("keydown", (e)=>{ if(e.key==="Escape") setSettingsOpen(false); });

saveBtnEl.addEventListener("click", ()=>{
  proxy = $("#proxyUrl").value || proxy;
  masterKey = $("#masterKey").value || masterKey;
  modelId = $("#modelId").value || modelId;
  webToolBase = $("#webToolBase").value || webToolBase;
  autoWeb = !!$("#autoWebToggle").checked;

  edenKey = $("#edenKey").value || "";
  ocrSpaceKey = $("#ocrSpaceKey").value || "";
  unstructuredKey = $("#unstructuredKey").value || "";
  ocrProxyUrl = $("#ocrProxyUrl").value || "";
  allowTesseractFallback = !!$("#allowTesseractFallback").checked;

  localStorage.setItem("aster.proxy", proxy);
  localStorage.setItem("aster.masterKey", masterKey);
  localStorage.setItem("aster.modelId", modelId);
  localStorage.setItem("aster.webToolBase", webToolBase);

function escapeHtml(s){ return (s||"").replace(/[&<>"']/g, m=>({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;" }[m])); }
function stripAttachmentBlock(s){ return (s||"").replace(/\n?---\nATTACHMENTS[\s\S]*?\n---/g, ""); }

function renderMsgHTML(role, text){
  if(role === "assistant"){

/* ========= Sources bar ========= */
function domainFrom(u){ try{ return new URL(u).hostname.replace(/^www\./,''); }catch{ return ""; } }
function favFrom(u){ const d = domainFrom(u); return d ? `https://www.google.com/s2/favicons?sz=64&domain=${encodeURIComponent(d)}` : ""; }

function harvestSourcesFromHtml(html){
  const div = document.createElement("div"); div.innerHTML = html||"";
  const set = new Map();
  div.querySelectorAll("a[href]").forEach(a=>{
    const href = a.getAttribute("href"); if(!href) return;
    const title = (a.textContent || href).trim();
    set.set(href, { title, url: href, snippet: "" });
  });
  // Regex fallback for raw text
  const raw = div.textContent || "";
  const urlRx = /\b(?:https?:\/\/|www\.)[^\s)]+/gi;
  const extras = raw.match(urlRx) || [];
  extras.forEach(u=>{ const url = u.startsWith("http") ? u : ("https://"+u); if(!set.has(url)) set.set(url, { title:url, url, snippet:"" }); });
  return Array.from(set.values()).slice(0,8);
}

function mountSourcesBar(chatInnerEl, afterMsgEl, results, engineLabel){
  const items = (results||[]).map(r=>({ url: r.url||r.link||r.href||"", title: r.title||r.name||r.url||"Untitled", snippet: r.snippet||r.description||"" }));

  const bar = document.createElement("div");
  bar.className = "sources-bar";
  bar.setAttribute("role","region");
  bar.setAttribute("aria-label","Sources");

  const head = document.createElement("div");
  head.className = "sources-head";
  head.setAttribute("role","button");
  head.setAttribute("tabindex","0");
  head.setAttribute("aria-expanded","false");
  head.innerHTML = `
    <span class="title">Sources</span>
    ${engineLabel ? `<small style="opacity:.75;">${escapeHtml(engineLabel)}</small>` : ""}
    <div class="chips"></div>
    <span class="sources-caret">›</span>
  `;
  const chips = head.querySelector(".chips");
  (items.length?items:[{title:"—"}]).forEach(it=>{
    const chip = document.createElement("span");
    chip.className = "sources-chip";
    const fav = favFrom(it.url||"");
    chip.innerHTML = fav ? `<img alt="" src="${fav}">` : "🔗";
    chips.appendChild(chip);
  });

  const list = document.createElement("div");
  list.className = "sources-list";
  list.setAttribute("aria-hidden","true");
  list.innerHTML = (items.length ? items.map((it)=>{
    const fav = favFrom(it.url);
    const dom = domainFrom(it.url);
    const sn  = (it.snippet||"").slice(0,240);
    return `
      <div class="sources-item">
        <img class="favicon" alt="" src="${fav}">
        <div>
          ${it.url ? `<a href="${it.url}" target="_blank" rel="noopener">${escapeHtml(it.title)}</a>` : `<span>${escapeHtml(it.title)}</span>`}
          ${dom ? ` <span style="opacity:.7;font-size:11px">(${escapeHtml(dom)})</span>` : ""}
          ${sn ? `<small style="display:block;opacity:.7">${escapeHtml(sn)}</small>` : ""}
        </div>
      </div>
    `;
  }).join("") : `
    <div class="sources-item">
      <div class="favicon">ⓘ</div>
      <div><small>No sources captured for this reply.</small></div>
    </div>
  `);

  function toggleOpen(force){
    const willOpen = typeof force === "boolean" ? force : !bar.classList.contains("sources-open");
    bar.classList.toggle("sources-open", willOpen);
    list.setAttribute("aria-hidden", willOpen ? "false" : "true");
    head.setAttribute("aria-expanded", willOpen ? "true" : "false");
  }
  head.addEventListener("click", ()=> toggleOpen());

  bar.appendChild(head); bar.appendChild(list);

  if(afterMsgEl && afterMsgEl.parentElement === chatInnerEl){
    chatInnerEl.insertBefore(bar, afterMsgEl.nextSibling);
  }else{
    chatInnerEl.appendChild(bar);
  }
  // Auto open if multiple items
  requestAnimationFrame(()=>{ if(items.length > 1) toggleOpen(true); });
  return bar;
}

async function fetchWithTimeout(url, opts={}, ms=60000){
  return await Promise.race([fetch(url, opts), new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')), ms))]);
}

async function ocrViaEdenAI(file){
  if(!edenKey) return "";
  try{
    const fd = new FormData();
    fd.append("providers","google,amazon,microsoft,ocrspace");
    fd.append("language","en");
    fd.append("fallback_providers","ocrspace");
    fd.append("file", file, file.name);
    const res = await fetchWithTimeout("https://api.edenai.run/v2/ocr/ocr", {
      method:"POST",
      headers:{ "Authorization": `Bearer ${edenKey}` },
      body: fd
    }, 90000);
    if(!res.ok) throw new Error("edenai "+res.status);
    const j = await res.json();
    // Provider responses vary; flatten best text chunks
    const texts = [];
    for(const k of Object.keys(j||{})){
      const v=j[k];
      if(v && typeof v==="object"){
        if(Array.isArray(v?.text_annotations)) texts.push(v.text_annotations.map(t=>t.content||t.text||"").join("\n"));
        if(typeof v?.text==="string") texts.push(v.text);
        if(Array.isArray(v?.pages)) texts.push(v.pages.map(p=>p.text||"").join("\n"));
      }
    }
    const out = texts.join("\n").trim();
    return out;
  }catch(e){ console.warn("edenAI OCR fail", e); return ""; }
}

async function ocrViaOCRSpace(file){
  if(!ocrSpaceKey) return "";
  try{
    const fd = new FormData();
    fd.append("apikey", ocrSpaceKey);
    fd.append("language","eng");
    fd.append("isOverlayRequired","false");
    fd.append("OCREngine","2");
    fd.append("detectOrientation","true");
    fd.append("scale","true");
    fd.append("file", file, file.name);
    const res = await fetchWithTimeout("https://api.ocr.space/parse/image", { method:"POST", body: fd }, 90000);
    if(!res.ok) throw new Error("ocr.space "+res.status);
    const j = await res.json();
    const arr = j?.ParsedResults || [];
    const text = arr.map(x=>x?.ParsedText||"").join("\n").trim();
    return text;
  }catch(e){ console.warn("ocr.space fail", e); return ""; }
}

async function ocrViaUnstructured(file){

async function ocrViaCustomProxy(file){

// Lightweight fallback using CDN Tesseract (lazy-loaded)
async function ocrViaTesseract(file){
  if(!allowTesseractFallback) return "";
  try{
    if(!window.Tesseract){
      await new Promise((resolve, reject)=>{
        const s=document.createElement('script'); s.src="https://cdn.jsdelivr.net/npm/tesseract.js@6.0.1/dist/tesseract.min.js"; s.onload=resolve; s.onerror=reject; document.head.appendChild(s);
      });
    }
    const worker = await window.Tesseract.createWorker("eng", 1, { logger:()=>{} });
    const dataURL = await new Promise(res=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.readAsDataURL(file); });
    const img = await new Promise(resolve=>{ const im=new Image(); im.onload=()=>resolve(im); im.src=dataURL; im.onerror=()=>resolve(null); });
    if(!img) return "";
    const canvas = document.createElement("canvas");
    canvas.width = Math.max(64, img.naturalWidth); canvas.height = Math.max(64, img.naturalHeight);
    canvas.getContext("2d", { willReadFrequently:true }).drawImage(img,0,0,canvas.width,canvas.height);
    await worker.setParameters({ tessedit_pageseg_mode: 6, tessedit_ocr_engine_mode: 1, user_defined_dpi:"220" });
    const { data } = await worker.recognize(canvas);
    await worker.terminate();
    return (data?.text||"").trim();
  }catch(e){ console.warn("tesseract fallback fail", e); return ""; }
}

async function extractPdfNative(file){
  try{
    if(!window.pdfjsLib){
      await new Promise((resolve, reject)=>{
        const s=document.createElement('script'); s.src="https://cdn.jsdelivr.net/npm/pdfjs-dist@4.7.76/build/pdf.min.js"; s.onload=resolve; s.onerror=reject; document.head.appendChild(s);
      });
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.7.76/build/pdf.worker.min.js";
    }
    const buf = await file.arrayBuffer();
    const doc = await pdfjsLib.getDocument({ data: buf }).promise;
    let out = "";
    const maxPages = Math.min(doc.numPages, 30);
    for(let i=1;i<=maxPages;i++){
      const page = await doc.getPage(i);
      const tc = await page.getTextContent();
      const rows = {}; const tol=2;
      (tc.items||[]).forEach(item=>{
        const tr=item.transform||[1,0,0,1,0,0]; const x=tr[4], y=tr[5];
        let k=null; for(const kk in rows){ if(Math.abs(Number(kk)-y)<=tol){ k=kk; break; } }
        if(k===null) k=y; (rows[k] ||= []).push({x, str:item.str||""});
      });
      const ykeys = Object.keys(rows).map(Number).sort((a,b)=>b-a);
      for(const y of ykeys){ const line = rows[y].sort((a,b)=>a.x-b.x).map(s=>s.str).join(" ").replace(/\s+/g," ").trim(); if(line) out += line + "\n"; }
      out += "\n";
    }
    const compact=(out||"").replace(/\s+/g,"");
    return compact.length>80 ? out : "";
  }catch(e){ console.warn("pdf native fail", e); return ""; }
}

async function extractPdfRasterViaExternal(file){
  // Try external adapters with the full PDF file (many providers accept PDFs directly)
  // We reuse the same functions; they will pass the PDF blob.
  let txt = "";
  txt = txt || await ocrViaEdenAI(file);
  txt = txt || await ocrViaUnstructured(file);
  txt = txt || await ocrViaOCRSpace(file);
  txt = txt || await ocrViaCustomProxy(file);
  return (txt||"").trim();
}

/* ========= Attachment extraction orchestrator ========= */
async function extractTextForAttachment(att){
  if(!att || !att.file) return;
  att._extracting = true; renderAttachments();
  const ext = (att.name.split('.').pop()||"").toLowerCase();
  const type = (att.type||"").toLowerCase();
  let text = "";

  try{
    if(type==="application/pdf"||ext==="pdf"){
      // First, try pulling native text; then external OCR if too weak
      const native = await extractPdfNative(att.file);
      const compact = (native||"").replace(/\s+/g,"");
      if(compact.length >= 120){ text = native; }
      if(!text){ text = await extractPdfRasterViaExternal(att.file); }
      if(!text){ text = await ocrViaTesseract(att.file); }
    }else if(type.startsWith("image/")){
      // Images: external engines first
      text = text || await ocrViaEdenAI(att.file);
      text = text || await ocrViaOCRSpace(att.file);
      text = text || await ocrViaCustomProxy(att.file);
      text = text || await ocrViaTesseract(att.file);
    }else if(type.startsWith("text/") || /(\.(txt|md|json|csv|tsv|yaml|yml|svg|xml|html?|css|js|ts|tsx|py|rb|php|java|c|cpp|cs|sql|ps1|bat|sh))$/i.test(att.name)){
      try{ text = await att.file.text(); }catch{}
    }
  }catch(e){
    console.warn("extract error", e);
  }

  att.text = (text||"").slice(0, 120000);
  att.extracted = !!att.text;
  att._extracting = false;
  renderAttachments();
  if(att.extracted) toast(`Extracted: ${att.name}`);
}

let inflight=null;

function buildAttachmentBlockForLLM(attachments){
  if(!attachments || !attachments.length) return "";
  const parts = [];
  for(const a of attachments){
    const name=a.name||"file";
    const type=(a.type||"").toLowerCase();
    const ext=(name.split('.').pop()||"").toLowerCase();
    const isTextLike = a.text || type.startsWith("text/") || /(\.(txt|md|json|csv|tsv|yaml|yml|svg|xml|html?|css|js|ts|tsx|py|rb|php|java|c|cpp|cs|sql|ps1|bat|sh))$/i.test(name);
    if(isTextLike){
      const content=(a.text || "").slice(0,120000);
      parts.push(`### ${name}\n\`\`\`\n${content}${content.length===120000?`\n[...truncated]`:``}\n\`\`\``);
    }else if(type==="application/pdf"){
      const content=(a.text || "").slice(0,120000);
      parts.push(`### ${name}\n\`\`\`\n${content}${content.length===120000?`\n[...truncated]`:``}\n\`\`\``);
    }else{
      parts.push(`### ${name}\n[type: ${type||"binary"} • ${formatBytes(a.size)}]`);
    }
  }
  return parts.length ? `---\nATTACHMENTS\n\n${parts.join("\n\n")}\n---` : "";
}

async function webSearchIfNeeded(query, max=4){

  try{

    const res = await fetchWithTimeout(u, { method:"GET" }, 20000);
    if(!res.ok) return null;
    const j = await res.json();
    const results = j?.results || j || [];
    return { engine: (j?.engine||"web"), results };
  }catch(e){ return null; }
}

async function sendMessage(){
  const typed=(composer?.value||"").trim();
  if(!typed && !sessionAttachments.length) return;

  // Build user bubble first
  const userEl = appendMessage("user", typed || "[sent attachments]", true);
  if (composer) composer.value = "";

  const turnAttachments = sessionAttachments.slice();
  const attachBlock = buildAttachmentBlockForLLM(turnAttachments);
  const combinedUser = attachBlock ? `${typed}\n\n${attachBlock}` : typed;

  // Update stored message with enriched content + metadata
  const c=getActive(); if(c && c.messages.length){
    const m=c.messages[c.messages.length-1];
    if(m.role==="user"){ m.content = combinedUser; m.attachments = turnAttachments.map(a=>({name:a.name,type:a.type,size:a.size})); persist(); mountAttachmentsBar(chatInner, userEl, m.attachments); }
  }

  // Optional web grounding
  let webCtx=null, webEngine=null;
  try{
    const maybe = await webSearchIfNeeded(typed, 4);
    if(maybe && maybe.results && maybe.results.length){ webCtx=maybe.results; webEngine=maybe.engine; }
  }catch{}

  // Compose API payload
  const payload = {
    model: modelId,
    stream: true,
    messages: [...(getActive()?.messages || [])].slice(-40)
  };
  const url = `${(proxy||"http://127.0.0.1:8001").replace(/\/+$/,"")}/v1/chat/completions`;
  const headers = { "Content-Type":"application/json", "Authorization": `Bearer ${masterKey}` };

  let outEl = appendMessage("assistant", "", true);
  let mdBuf = "";

  sendBtn.classList.add("sending");
  inflight = new AbortController();

  try{
    const res = await fetch(url,{method:"POST", headers, body:JSON.stringify(payload), signal: inflight.signal});
    if(!res.ok){ throw new Error(await res.text() || `${res.status} ${res.statusText}`); }
    const reader = res.body.getReader(); const decoder = new TextDecoder(); let acc="";
    for(;;){
      const {value,done} = await reader.read(); if(done) break;
      acc += decoder.decode(value,{stream:true});
      const lines = acc.split(/\r?\n/); acc = lines.pop() || "";
      for(const line of lines){
        const m = line.match(/^data:\s*(.*)$/); if(!m) continue;
        if(m[1]==="[DONE]"){ acc=""; break; }
        try{
          const obj = JSON.parse(m[1]); const delta = obj.choices?.[0]?.delta?.content ?? "";
          if(delta){
            mdBuf += delta;
            outEl.innerHTML = DOMPurify.sanitize(marked.parse(mdBuf));
            try { mermaid.init(undefined, outEl.querySelectorAll(".language-mermaid, .mermaid")); } catch {}
            chatInner?.parentElement && (chatInner.parentElement.scrollTop = chatInner.parentElement.scrollHeight);
          }
        }catch{}
      }
    }
  }catch(err){
    outEl.innerHTML += `<br><span style="color:#ff8080;">⚠ ${escapeHtml(String(err.message||err))}</span>`;
  }finally{
    sendBtn.classList.remove("sending");
    inflight=null;

    // Persist final content to convo
    const c2=getActive();
    if(c2){ const last=c2.messages[c2.messages.length-1]; if(last && last.role==="assistant"){ last.content = mdBuf; persist(); } }

    // Mount sources bar ALWAYS.
    let mountData = null, label = "via search module unavailable";
    if(webCtx && webCtx.length){ mountData = webCtx; label = webEngine ? `${webEngine}` : "web"; }
    else{
      // Parse the rendered assistant bubble
      mountData = harvestSourcesFromHtml(outEl.innerHTML);
      if(mountData.length) label = "parsed from answer";
    }
    mountSourcesBar(chatInner, outEl, mountData || [], label);

    // Clear this turn's attachments
    sessionAttachments = []; renderAttachments();
  }
}
sendBtn.addEventListener("click", ()=>{ if(inflight){ inflight.abort(); return; } sendMessage(); });
composer.addEventListener("keydown",(e)=>{ if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); if(inflight){ inflight.abort(); return; } sendMessage(); }});

/* ========= Attachments bar (compact) ========= */
function fileIcon(name,type){
  const ext=(name.split('.').pop()||'').toLowerCase();
  const t=(type||'').toLowerCase();
  if(t.includes('pdf') || ext==='pdf') return '📕';
  if(t.startsWith('image/') || ['png','jpg','jpeg','gif','webp','svg','ico','bmp','tif','tiff'].includes(ext)) return '🖼️';
  if(['csv','tsv'].includes(ext)) return '📊';
  if(['xlsx','xls'].includes(ext)) return '📈';
  if(['json','yaml','yml','txt','md','svg','xml','html','htm','css','scss','less','js','mjs','cjs','jsx','ts','tsx','py','rb','php','go','rs','java','kt','c','cpp','h','hpp','cs','sql','ps1','bat','sh'].includes(ext)) return '📄';
  if(t.startsWith('audio/') || ['mp3','wav'].includes(ext)) return '🎵';
  if(t.startsWith('video/') || ['mp4','mov','avi'].includes(ext)) return '🎞️';
  return '📎';
}
function mountAttachmentsBar(chatInnerEl, afterMsgEl, atts){
  const items = (atts||[]).map(a=>({ name: a.name || "file", type: a.type || "", size: a.size || 0 }));
  const bar = document.createElement("div");
  bar.className = "sources-bar";
  bar.setAttribute("role","region");
  bar.setAttribute("aria-label","Attachments");

  const head = document.createElement("div");
  head.className = "sources-head";
  head.setAttribute("role","button");
  head.setAttribute("tabindex","0");
  head.setAttribute("aria-expanded","false");
  head.innerHTML = `
    <span class="title">Attachments</span>
    <div class="chips"></div>
    <span class="sources-caret">›</span>
  `;
  const chips = head.querySelector(".chips");
  items.forEach(it=>{
    const chip = document.createElement("span");
    chip.className = "sources-chip";
    chip.textContent = fileIcon(it.name, it.type);
    chips.appendChild(chip);
  });

  const list = document.createElement("div");
  list.className = "sources-list";
  list.setAttribute("aria-hidden","true");
  list.innerHTML = items.map((it)=>{
    return `
      <div class="sources-item">
        <div class="favicon">${fileIcon(it.name, it.type)}</div>
        <div>
          <div class="name">${escapeHtml(it.name)}</div>
          <small>${escapeHtml(it.type || 'binary')}${it.size?` • ${formatBytes(it.size)}`:''}</small>
        </div>
      </div>
    `;
  }).join("");

  function toggleOpen(force){
    const willOpen = typeof force === "boolean" ? force : !bar.classList.contains("sources-open");
    bar.classList.toggle("sources-open", willOpen);
    list.setAttribute("aria-hidden", willOpen ? "false" : "true");
    head.setAttribute("aria-expanded", willOpen ? "true" : "false");
  }
  head.addEventListener("click", ()=> toggleOpen());

  bar.appendChild(head);
  bar.appendChild(list);

  if(afterMsgEl && afterMsgEl.parentElement === chatInnerEl){
    chatInnerEl.insertBefore(bar, afterMsgEl.nextSibling);
  }else{
    chatInnerEl.appendChild(bar);
  }
  requestAnimationFrame(()=>{ if(items.length) toggleOpen(true); });
  return bar;
}

/* ========= Boot ========= */
renderConversations(); renderActiveConversation();

})();</script>
